{% extends "base.html" %}

{% block title %}500 Server Error — {{ vip_site_name }}{% endblock %}

{% block content %}
<div class="container-mobile" style="max-width: 480px; text-align: center; margin-top: 40px;">
  <div class="vip-card" style="padding: 40px 24px;">
    <div style="font-size: 3.5rem; margin-bottom: 12px;">⚠️</div>
    <h1 style="font-size: 1.75rem; font-weight: 800; color: #0F172A; margin-bottom: 8px;">Internal Server Error</h1>
    <p style="font-size: 0.9rem; color: #64748B; margin-bottom: 24px;">
      An unexpected condition was encountered. The error has been logged for review.
    </p>
    <a href="{{ url_for('dashboard') if current_user else url_for('home') }}" class="btn-primary" style="padding: 12px 28px;">
      ← Return to {{ site_name }}
    </a>
  </div>
</div>
{% endblock %}
