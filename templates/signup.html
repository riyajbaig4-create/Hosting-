{% extends "base.html" %}

{% block title %}Create Account — {{ vip_site_name }}{% endblock %}

{% block content %}
<div class="container-mobile" style="max-width: 460px; margin-top: 20px;">

  <div class="vip-card" style="padding: 32px 24px;">
    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 20px;">
      <div style="width: 58px; height: 58px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;">
        <img src="{{ site_logo_url }}" alt="{{ site_name }}" width="54" height="54" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.onerror=null;this.src='{{ url_for('static', filename='img/logo.svg') }}';">
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: #0F172A; margin-bottom: 4px;">Create Account</h1>
      <p style="font-size: 0.875rem; color: #64748B;">Join {{ site_name }} and get instant free coins to deploy servers.</p>
    </div>



    <!-- Sign Up Form -->
    <form action="{{ url_for('signup') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input 
          type="text" 
          id="full_name" 
          name="full_name" 
          class="form-control" 
          placeholder="Full Name" 
          value="{{ full_name or '' }}" 
          required 
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          placeholder="Host" 
          value="{{ username or '' }}" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Gmail Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="yourname@gmail.com" 
          value="{{ email or '' }}" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="btn-primary btn-block" style="padding: 12px; font-size: 0.95rem; font-weight: 700; border-radius: 8px;">
        Create Account
      </button>
    </form>

    <!-- Switch to Signin -->
    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light); font-size: 0.875rem; color: var(--text-secondary);">
      Already have an account? 
      <a href="{{ url_for('signin') }}" style="color: var(--primary-purple); font-weight: 700;">Sign In</a>
    </div>
  </div>

</div>
{% endblock %}
